name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  cla_assistant:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/MartinZikmund/Awaitick/blob/main/CLA.md
          # Signatures live on their own branch so they never land on main — a push to main
          # would otherwise trigger CI and the Static Web Apps deployment on every signature.
          branch: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          allowlist: MartinZikmund,dependabot[bot],renovate[bot],copilot-swe-agent[bot]
          custom-notsigned-prcomment: >
            Thanks for your contribution! Before it can be merged, please read our
            [Contributor Licence Agreement](https://github.com/MartinZikmund/Awaitick/blob/main/CLA.md)
            and sign it by posting the comment below. You keep the copyright in your work —
            [LICENSING.md](https://github.com/MartinZikmund/Awaitick/blob/main/LICENSING.md)
            explains why the agreement exists.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
